            function chunkAndTagFile(xmlText, targetChunkSizeKB = 40) {
                const TARGET_CHUNK_SIZE = targetChunkSizeKB * 1024;
                const headerEndIndex = xmlText.indexOf("<measure");
                if (headerEndIndex === -1)
                    throw new Error("Invalid MusicXML: No measures found.");

                const xmlHeader = xmlText.substring(0, headerEndIndex);
                const measureRegex = /<measure[\s\S]*?<\/measure>/g;
                const allMeasures = xmlText.match(measureRegex);

                console.log(`All measures: ${allMeasures.length}`);

                if (!allMeasures)
                    throw new Error(
                        "Could not parse explicit measure objects.",
                    );

                const chunks = [];
                let currentChunkMeasures = [];
                let currentChunkSize = 0;

                allMeasures.map((measure) => {
                    currentChunkMeasures.push(measure);
                    currentChunkSize += new Blob([measure]).size;

                    if (currentChunkSize >= TARGET_CHUNK_SIZE) {
                        console.log(
                            `Current chunk size: ${currentChunkSize} bytes`,
                        );
                        chunks.push(
                            compileChunk(xmlHeader, currentChunkMeasures),
                        );
                        currentChunkMeasures = [];
                        currentChunkSize = 0;
                    }

                    //  console.log(`Chunk size: ${currentChunkSize} bytes`);
                });
                return chunks;
            }

            function compileChunk(header, measuresArray) {
                const measuresContent = measuresArray.join("\n");
                let closingTags = "";
                if (header.includes("<part")) closingTags += "</part>\n";
                if (header.includes("<score-partwise"))
                    closingTags += "</score-partwise>\n";

                const fullChunkString = `${header}\n${measuresContent}\n${closingTags}`;

                const blob = new Blob([fullChunkString], {
                    type: "application/xml",
                });

                //console.log("Compiled chunk", blob);
                return blob;
            }
